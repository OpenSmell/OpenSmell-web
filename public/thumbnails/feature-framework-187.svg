<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#ffffff"/>
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#111111" stroke-width="2.5"/>
  <rect x="32" y="32" width="1136" height="566" fill="none" stroke="#111111" stroke-width="1"/>

  <g stroke="#111111" stroke-width="1" fill="none">
    <line x1="32" y1="66" x2="80" y2="66"/><line x1="32" y1="564" x2="80" y2="564"/>
    <line x1="1120" y1="66" x2="1168" y2="66"/><line x1="1120" y1="564" x2="1168" y2="564"/>
    <line x1="40" y1="40" x2="40" y2="88"/><line x1="1160" y1="40" x2="1160" y2="88"/>
    <line x1="40" y1="542" x2="40" y2="590"/><line x1="1160" y1="542" x2="1160" y2="590"/>
  </g>

  <g fill="#e5e5e5" stroke="#111111" stroke-width="1">
    <polygon points="60,70 77,61 94,70 94,88 77,97 60,88"/>
    <polygon points="1140,70 1157,61 1174,70 1174,88 1157,97 1140,88"/>
  </g>

  <text x="48" y="56" font-family="ui-monospace, monospace" font-size="14" fill="#111111" letter-spacing="1">OPEN SMELL · ACADEMY</text>
  <text x="852" y="56" font-family="ui-monospace, monospace" font-size="14" fill="#555555" letter-spacing="1">FEATURE ENGINEERING</text>
  <text x="600" y="130" text-anchor="middle" font-family="ui-monospace, monospace" font-size="34" font-weight="bold" fill="#111111" letter-spacing="1">187 DIMENSIONS, EXPLAINED</text>
  <text x="600" y="156" text-anchor="middle" font-family="ui-monospace, monospace" font-size="15" fill="#555555" letter-spacing="1">5-CATEGORY TAXONOMY · SELECTIVITY RATIOS · 6 CHANNELS</text>

  <line x1="120" y1="200" x2="1040" y2="200" stroke="#111111" stroke-width="1"/>

  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="60" y="238" font-size="13" font-weight="bold">PER-CHANNEL: 21 + 7 ADVANCED</text>
  </g>

  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="60" y="264" font-size="12" font-weight="bold">Device-agnostic · 6</text>
    <text x="60" y="280" font-size="11" fill="#555555">amplitude, rise/decay time, AUC ratios</text>
    <text x="60" y="296" font-size="12" font-weight="bold">Absolute · 4</text>
    <text x="60" y="312" font-size="11" fill="#555555">raw R, calibrated concentration</text>
    <text x="60" y="328" font-size="12" font-weight="bold">Temporal · 4</text>
    <text x="60" y="344" font-size="11" fill="#555555">timing of response onset/recovery</text>
    <text x="60" y="360" font-size="12" font-weight="bold">Health · 4</text>
    <text x="60" y="376" font-size="11" fill="#555555">noise_floor, drift_rate, cv</text>
    <text x="60" y="392" font-size="12" font-weight="bold">Hardware · 3</text>
    <text x="60" y="408" font-size="11" fill="#555555">gain, adcMax-scaled values</text>
  </g>

  <line x1="420" y1="236" x2="420" y2="430" stroke="#111111" stroke-width="1" stroke-dasharray="6,4"/>

  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="450" y="258" font-size="13" font-weight="bold">WHY RELATIVE FEATURES TRANSFER</text>
    <text x="450" y="280" font-size="11" fill="#555555">after Rs/R₀, amplitude / times / ratios are</text>
    <text x="450" y="294" font-size="11" fill="#555555">invariant to V_cc and R_L (§4.6)</text>
    <text x="450" y="314" font-size="11" fill="#555555">absolute features stay device-scale-bound</text>
    <text x="450" y="334" font-size="11" fill="#555555">⇒ cross-device learning leans on the</text>
    <text x="450" y="348" font-size="11" fill="#555555">device-agnostic + relative set</text>
  </g>

  <g stroke="#111111" fill="none">
    <path d="M 450 392 q 30 -20 70 -26 q 40 -6 60 4" stroke-width="1.5"/>
    <path d="M 450 408 q 30 -10 70 -12 q 40 -2 60 8" stroke-width="1.5" stroke-dasharray="4,3"/>
  </g>
  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="600" y="382" font-size="11" fill="#555555">relative (transfer)</text>
    <text x="600" y="430" font-size="11" fill="#555555">absolute (bound)</text>
  </g>

  <line x1="760" y1="236" x2="760" y2="430" stroke="#111111" stroke-width="1" stroke-dasharray="6,4"/>

  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="790" y="258" font-size="13" font-weight="bold">SELECTIVITY RATIOS</text>
  </g>
  <text x="790" y="292" font-family="ui-monospace, monospace" font-size="18" fill="#111111">dr_i/dr_j = (a_i/a_j)·C^(b_i−b_j)</text>
  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="790" y="316" font-size="11" fill="#555555">concentration-invariant only when b_i = b_j</text>
    <text x="790" y="332" font-size="11" fill="#555555">approximately invariant for similar exponents</text>
    <text x="790" y="352" font-size="11" fill="#555555">⇒ survive unknown-concentration capture</text>
  </g>

  <g stroke="#111111" fill="none">
    <rect x="790" y="368" width="120" height="30" stroke-width="1.5"/>
    <rect x="914" y="368" width="120" height="30" stroke-width="1.5"/>
    <rect x="1038" y="368" width="120" height="30" stroke-width="1.5"/>
  </g>
  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="850" y="388" text-anchor="middle" font-size="12">91 @ 3ch</text>
    <text x="974" y="388" text-anchor="middle" font-size="12">187 @ 6ch</text>
    <text x="1098" y="388" text-anchor="middle" font-size="12">406 @ 12ch</text>
  </g>

  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="790" y="422" font-size="12" font-weight="bold">DECAY FITS: tau₁/tau₂</text>
    <text x="790" y="440" font-size="11" fill="#555555">single / bi / tri-exponential · surface heterogeneity</text>
  </g>

  <line x1="60" y1="470" x2="1140" y2="470" stroke="#111111" stroke-width="1" stroke-dasharray="6,4"/>

  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="60" y="496" font-size="13" font-weight="bold">THE COUNT, MADE EXPLICIT (6 CHANNELS)</text>
    <text x="60" y="516" font-size="12" fill="#555555">21 per-channel × 6 = 126</text>
    <text x="60" y="534" font-size="12" fill="#555555">+ 7 advanced × 6 = 42</text>
    <text x="60" y="552" font-size="12" fill="#555555">+ C(6,2) selectivity = 15</text>
    <text x="60" y="570" font-size="12" fill="#555555">+ 4 global = 187 ✓</text>
  </g>

  <line x1="560" y1="480" x2="560" y2="576" stroke="#111111" stroke-width="1" stroke-dasharray="3,3"/>

  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="580" y="500" font-size="13" font-weight="bold">TAXONOMY IS THE POINT</text>
    <text x="580" y="520" font-size="11" fill="#555555">feature names are structured — you can reason</text>
    <text x="580" y="536" font-size="11" fill="#555555">about "amplitude on CO channel" as a concept,</text>
    <text x="580" y="552" font-size="11" fill="#555555">not a column 137. Interpretation guide in §4.8.</text>
  </g>

  <rect x="840" y="522" width="328" height="76" fill="none" stroke="#111111" stroke-width="1.5"/>
  <line x1="840" y1="560" x2="1168" y2="560" stroke="#111111" stroke-width="1"/>
  <line x1="1020" y1="522" x2="1020" y2="598" stroke="#111111" stroke-width="1"/>
  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="852" y="546" font-size="12" font-weight="bold">OPEN SMELL ACADEMY</text>
    <text x="852" y="584" font-size="12">REV A · 2026</text>
    <text x="1032" y="546" font-size="12">FIG. 017</text>
    <text x="1032" y="584" font-size="12">SCALE NTS</text>
  </g>
</svg>
