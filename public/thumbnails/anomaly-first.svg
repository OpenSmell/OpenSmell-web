<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#ffffff"/>
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#111111" stroke-width="2.5"/>
  <rect x="32" y="32" width="1136" height="566" fill="none" stroke="#111111" stroke-width="1"/>

  <g stroke="#111111" stroke-width="1" fill="none">
    <line x1="32" y1="66" x2="80" y2="66"/><line x1="32" y1="564" x2="80" y2="564"/>
    <line x1="1120" y1="66" x2="1168" y2="66"/><line x1="1120" y1="564" x2="1168" y2="564"/>
    <line x1="40" y1="40" x2="40" y2="88"/><line x1="1160" y1="40" x2="1160" y2="88"/>
    <line x1="40" y1="542" x2="40" y2="590"/><line x1="1160" y1="542" x2="1160" y2="590"/>
  </g>

  <g fill="#e5e5e5" stroke="#111111" stroke-width="1">
    <polygon points="60,70 77,61 94,70 94,88 77,97 60,88"/>
    <polygon points="1140,70 1157,61 1174,70 1174,88 1157,97 1140,88"/>
  </g>

  <text x="48" y="56" font-family="ui-monospace, monospace" font-size="14" fill="#111111" letter-spacing="1">OPEN SMELL · ACADEMY</text>
  <text x="852" y="56" font-family="ui-monospace, monospace" font-size="14" fill="#555555" letter-spacing="1">DEPLOYMENT STRATEGY</text>
  <text x="600" y="130" text-anchor="middle" font-family="ui-monospace, monospace" font-size="34" font-weight="bold" fill="#111111" letter-spacing="1">ANOMALY FIRST</text>
  <text x="600" y="156" text-anchor="middle" font-family="ui-monospace, monospace" font-size="15" fill="#555555" letter-spacing="1">UTILITY NOW · INTEROPERABILITY AS AMPLIFIER</text>

  <line x1="120" y1="200" x2="1040" y2="200" stroke="#111111" stroke-width="1"/>

  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="80" y="244" font-size="13" font-weight="bold">WHAT IS MEASURED-DEPLOYABLE TODAY</text>
  </g>

  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="120" y="292" font-size="12" font-weight="bold">EVENT DETECTION</text>
    <text x="120" y="310" font-size="12" fill="#555555">Kalman innovation AUC ≈ 0.87</text>
    <text x="120" y="326" font-size="12" fill="#555555">latent-Δ / EWMA 0.87 / 0.78</text>
    <text x="460" y="292" font-size="12" font-weight="bold">SUBSTANCE ID</text>
    <text x="460" y="310" font-size="12" fill="#555555">SmellNet LOO AUC ≈ 0.52</text>
    <text x="460" y="326" font-size="12" fill="#555555">novel-substance extrapolation: chance</text>
    <text x="120" y="352" font-size="12" font-weight="bold">SHIPPABLE</text>
    <text x="460" y="352" font-size="12" font-weight="bold">NOT SHIPPABLE</text>
  </g>

  <g stroke="#111111" fill="none">
    <rect x="80" y="376" width="580" height="120" stroke-width="1.5"/>
  </g>
  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="96" y="400" font-size="13" font-weight="bold">THE MEMORY-SAFE BASELINE</text>
    <text x="96" y="424" font-size="12" fill="#555555">1 · 300-second safe-gap — alarms inside it are</text>
    <text x="132" y="440" font-size="12" fill="#555555">memory-flagged (62% of FP is residue)</text>
    <text x="96" y="460" font-size="12" fill="#555555">2 · per-session R0 — recompute from ≥300 s</text>
    <text x="132" y="476" font-size="12" fill="#555555">of clean air, never trust a stale R0</text>
    <text x="96" y="492" font-size="12" fill="#555555">3 · per-channel priming awareness — sign</text>
    <text x="132" y="508" font-size="12" fill="#555555">changes per gas and device; track, don't assume</text>
  </g>

  <g stroke="#111111" fill="none">
    <rect x="660" y="376" width="480" height="120" stroke-width="1.5"/>
  </g>
  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="676" y="400" font-size="13" font-weight="bold">ADAPTIVE BASELINE / LONG-TERM</text>
    <text x="676" y="424" font-size="12" fill="#555555">static baseline dies in ~2 days on a real array</text>
    <text x="676" y="440" font-size="12" fill="#555555">tracked baseline holds events at +0.78σ</text>
    <text x="676" y="456" font-size="12" fill="#555555">0.2% clean FPR · 682/700 events, 40 days</text>
    <text x="676" y="476" font-size="12" fill="#555555">drift is absorbed, not fought</text>
  </g>

  <line x1="620" y1="252" x2="620" y2="356" stroke="#111111" stroke-width="1" stroke-dasharray="6,4"/>

  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="676" y="292" font-size="12" font-weight="bold">SCREENING</text>
    <text x="676" y="310" font-size="12" fill="#555555">matched-dose pairs resolve in 0.5 s</text>
    <text x="676" y="326" font-size="12" fill="#555555">said as "family", never "molecule X"</text>
  </g>

  <line x1="120" y1="520" x2="1040" y2="520" stroke="#111111" stroke-width="1"/>

  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="80" y="552" font-size="13" font-weight="bold">HOW THE DATA COMPOUNDS · TODAY →</text>
    <text x="552" y="552" font-size="13" font-weight="bold">AS DATA ACCUMULATES</text>
  </g>
  <g stroke="#111111" fill="none">
    <path d="M 480 536 L 516 536 L 516 548 L 552 548" stroke-width="1.5" fill="none"/>
    <polygon points="552,548 540,541 540,555"/>
  </g>
  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="120" y="586" font-size="11" fill="#555555">one device · event detection · screening</text>
    <text x="552" y="586" font-size="11" fill="#555555">98-feature core shared · per-device calibration → ID</text>
    <text x="120" y="604" font-size="11" font-weight="bold">base value: NOW</text>
    <text x="552" y="604" font-size="11" font-weight="bold">value: COMPOUNDS</text>
  </g>

  <rect x="840" y="300" width="0" height="0" fill="none"/>

  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="676" y="356" font-size="11" fill="#555555">interoperability is not the precondition</text>
    <text x="676" y="370" font-size="11" fill="#555555">for utility; it is the amplifier of it.</text>
  </g>

  <rect x="840" y="522" width="328" height="76" fill="none" stroke="#111111" stroke-width="1.5"/>
  <line x1="840" y1="560" x2="1168" y2="560" stroke="#111111" stroke-width="1"/>
  <line x1="1020" y1="522" x2="1020" y2="598" stroke="#111111" stroke-width="1"/>
  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="852" y="546" font-size="12" font-weight="bold">OPEN SMELL ACADEMY</text>
    <text x="852" y="584" font-size="12">REV A · 2026</text>
    <text x="1032" y="546" font-size="12">FIG. 024</text>
    <text x="1032" y="584" font-size="12">SCALE NTS</text>
  </g>
</svg>