<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#ffffff"/>
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#111111" stroke-width="2.5"/>
  <rect x="32" y="32" width="1136" height="566" fill="none" stroke="#111111" stroke-width="1"/>

  <g stroke="#111111" stroke-width="1" fill="none">
    <line x1="32" y1="66" x2="80" y2="66"/><line x1="32" y1="564" x2="80" y2="564"/>
    <line x1="1120" y1="66" x2="1168" y2="66"/><line x1="1120" y1="564" x2="1168" y2="564"/>
    <line x1="40" y1="40" x2="40" y2="88"/><line x1="1160" y1="40" x2="1160" y2="88"/>
    <line x1="40" y1="542" x2="40" y2="590"/><line x1="1160" y1="542" x2="1160" y2="590"/>
  </g>

  <g fill="#e5e5e5" stroke="#111111" stroke-width="1">
    <polygon points="60,70 77,61 94,70 94,88 77,97 60,88"/>
    <polygon points="1140,70 1157,61 1174,70 1174,88 1157,97 1140,88"/>
  </g>

  <text x="48" y="56" font-family="ui-monospace, monospace" font-size="14" fill="#111111" letter-spacing="1">OPEN SMELL · ACADEMY</text>
  <text x="852" y="56" font-family="ui-monospace, monospace" font-size="14" fill="#555555" letter-spacing="1">NORMALIZATION THEOREM</text>
  <text x="600" y="130" text-anchor="middle" font-family="ui-monospace, monospace" font-size="34" font-weight="bold" fill="#111111" letter-spacing="1">WHAT Rs/R₀ CANCELS — AND CANNOT</text>
  <text x="600" y="156" text-anchor="middle" font-family="ui-monospace, monospace" font-size="15" fill="#555555" letter-spacing="1">THE THEOREM · ZERO-SHOT LIMITS · PER-RIG CALIBRATION</text>

  <line x1="120" y1="200" x2="1040" y2="200" stroke="#111111" stroke-width="1"/>

  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="60" y="238" font-size="13" font-weight="bold">THE DIVIDER, IN FULL</text>
  </g>
  <rect x="60" y="250" width="500" height="70" fill="none" stroke="#111111" stroke-width="1.5"/>
  <g stroke="#111111" fill="none">
    <line x1="80" y1="300" x2="80" y2="322" stroke-width="1"/>
    <line x1="200" y1="300" x2="200" y2="322" stroke-width="1"/>
    <line x1="80" y1="322" x2="200" y2="322" stroke-width="1"/>
    <rect x="80" y="270" width="120" height="30" stroke-width="1.5"/>
    <path d="M 210 285 h 14 v -14 h 16 v 14 h 14" stroke-width="1.5" fill="none"/>
    <line x1="258" y1="322" x2="380" y2="322" stroke-width="1"/>
    <rect x="260" y="270" width="120" height="30" stroke-width="1.5"/>
    <path d="M 390 285 h 14 v -14 h 16 v 14 h 14" stroke-width="1.5" fill="none"/>
  </g>
  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="100" y="292" text-anchor="middle" font-size="13">R_s(t)</text>
    <text x="280" y="292" text-anchor="middle" font-size="13">R_L</text>
    <text x="128" y="256" font-size="11" fill="#555555">sensor</text>
    <text x="308" y="256" font-size="11" fill="#555555">load (fixed)</text>
  </g>
  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="470" y="292" font-size="14">V(t) = V_cc · R_L / (R_s(t) + R_L)</text>
    <text x="470" y="310" font-size="12" fill="#555555">two unknowns, one equation — R_s must be solved</text>
  </g>

  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="60" y="356" font-size="13" font-weight="bold">NORMALIZE BY R₀  ⇒  RATIO</text>
  </g>
  <rect x="60" y="368" width="500" height="64" fill="none" stroke="#111111" stroke-width="1.5"/>
  <text x="80" y="396" font-family="ui-monospace, monospace" font-size="14" fill="#111111">Rs/R₀  =  a·Cᵇ</text>
  <text x="80" y="416" font-family="ui-monospace, monospace" font-size="12" fill="#555555">divides out V_cc and R_L exactly (§4.6 proof)</text>

  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="60" y="464" font-size="13" font-weight="bold">IT CANNOT CANCEL THE SENSOR</text>
  </g>
  <rect x="60" y="476" width="500" height="76" fill="none" stroke="#111111" stroke-width="1.5"/>
  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="80" y="498" font-size="12" font-weight="bold">SURVIVES:</text>
    <text x="80" y="518" font-size="12" fill="#555555">a, b  · humidity  · temperature  · air flow</text>
    <text x="80" y="536" font-size="11" fill="#555555">Rs/R₀ = a·Cᵇ still depends on a, b (20–30% batch tolerance)</text>
  </g>

  <line x1="600" y1="238" x2="600" y2="560" stroke="#111111" stroke-width="1" stroke-dasharray="6,4"/>

  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="620" y="238" font-size="13" font-weight="bold">TWO RIGS, SAME GAS</text>
  </g>

  <rect x="620" y="252" width="220" height="150" fill="none" stroke="#111111" stroke-width="1.5"/>
  <rect x="640" y="268" width="180" height="12" fill="#111111"/>
  <rect x="640" y="300" width="180" height="30" fill="#ffffff" stroke="#111111" stroke-width="1"/>
  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="730" y="318" text-anchor="middle" font-size="12">SnO₂</text>
    <text x="640" y="286" font-size="11" font-weight="bold">RIG A</text>
  </g>
  <g stroke="#111111" fill="none">
    <path d="M 665 420 q 10 -20 30 -28 q 20 -8 40 -4 q 30 6 50 -18 q 12 -14 12 -24" stroke-width="2"/>
    <path d="M 680 300 q 10 -8 22 -10 q 14 -2 26 2" stroke-width="1"/>
  </g>
  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="652" y="398" font-size="11" fill="#555555">C = 50 ppm ethanol</text>
    <text x="672" y="438" font-size="11">raw Rs: 4.1 kΩ</text>
  </g>

  <rect x="900" y="252" width="220" height="150" fill="none" stroke="#111111" stroke-width="1.5"/>
  <rect x="920" y="268" width="180" height="12" fill="#111111"/>
  <rect x="920" y="300" width="180" height="30" fill="#ffffff" stroke="#111111" stroke-width="1"/>
  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="1010" y="318" text-anchor="middle" font-size="12">SnO₂</text>
    <text x="920" y="286" font-size="11" font-weight="bold">RIG B</text>
  </g>
  <g stroke="#111111" fill="none">
    <path d="M 945 420 q 10 -24 32 -32 q 22 -8 42 -2 q 28 8 48 -22 q 12 -16 12 -24" stroke-width="2"/>
    <path d="M 960 300 q 12 -12 26 -12 q 14 0 24 6" stroke-width="1"/>
  </g>
  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="932" y="398" font-size="11" fill="#555555">C = 50 ppm ethanol</text>
    <text x="952" y="438" font-size="11">raw Rs: 3.3 kΩ</text>
  </g>

  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="620" y="462" font-size="13" font-weight="bold">AFTER Rs/R₀, STILL DIFFERENT</text>
  </g>
  <rect x="620" y="474" width="500" height="72" fill="none" stroke="#111111" stroke-width="1.5"/>
  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="640" y="498" font-size="13">A: a_A·Cᵇᵃ   ≠   B: a_B·Cᵇᵇ</text>
    <text x="640" y="520" font-size="11" fill="#555555">cross-device zero-shot: 10–18% vs 25% chance (§8.3)</text>
    <text x="640" y="536" font-size="11" fill="#555555">calibration is per-rig and per-substance</text>
  </g>

  <rect x="840" y="522" width="328" height="76" fill="none" stroke="#111111" stroke-width="1.5"/>
  <line x1="840" y1="560" x2="1168" y2="560" stroke="#111111" stroke-width="1"/>
  <line x1="1020" y1="522" x2="1020" y2="598" stroke="#111111" stroke-width="1"/>
  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="852" y="546" font-size="12" font-weight="bold">OPEN SMELL ACADEMY</text>
    <text x="852" y="584" font-size="12">REV A · 2026</text>
    <text x="1032" y="546" font-size="12">FIG. 012</text>
    <text x="1032" y="584" font-size="12">SCALE NTS</text>
  </g>
</svg>
