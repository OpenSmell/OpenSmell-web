<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#ffffff"/>
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#111111" stroke-width="2.5"/>
  <rect x="32" y="32" width="1136" height="566" fill="none" stroke="#111111" stroke-width="1"/>

  <g stroke="#111111" stroke-width="1" fill="none">
    <line x1="32" y1="66" x2="80" y2="66"/><line x1="32" y1="564" x2="80" y2="564"/>
    <line x1="1120" y1="66" x2="1168" y2="66"/><line x1="1120" y1="564" x2="1168" y2="564"/>
    <line x1="40" y1="40" x2="40" y2="88"/><line x1="1160" y1="40" x2="1160" y2="88"/>
    <line x1="40" y1="542" x2="40" y2="590"/><line x1="1160" y1="542" x2="1160" y2="590"/>
  </g>

  <g fill="#e5e5e5" stroke="#111111" stroke-width="1">
    <polygon points="60,70 77,61 94,70 94,88 77,97 60,88"/>
    <polygon points="1140,70 1157,61 1174,70 1174,88 1157,97 1140,88"/>
  </g>

  <text x="48" y="56" font-family="ui-monospace, monospace" font-size="14" fill="#111111" letter-spacing="1">OPEN SMELL · ACADEMY</text>
  <text x="852" y="56" font-family="ui-monospace, monospace" font-size="14" fill="#555555" letter-spacing="1">MODEL EVALUATION</text>
  <text x="600" y="130" text-anchor="middle" font-family="ui-monospace, monospace" font-size="34" font-weight="bold" fill="#111111" letter-spacing="1">EVALUATE THE WAY IT WILL BE USED</text>
  <text x="600" y="156" text-anchor="middle" font-family="ui-monospace, monospace" font-size="15" fill="#555555" letter-spacing="1">SESSION HOLDOUT · LEAK-AWARE SPLITS · HONEST NUMBERS</text>

  <line x1="120" y1="200" x2="1040" y2="200" stroke="#111111" stroke-width="1"/>

  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="60" y="240" font-size="13" font-weight="bold">TRAIN / VAL / TEST — THE LEAK</text>
  </g>

  <rect x="60" y="258" width="160" height="120" fill="#111111"/>
  <rect x="250" y="258" width="160" height="120" fill="#e5e5e5" stroke="#111111" stroke-width="1.5"/>
  <rect x="440" y="258" width="160" height="120" fill="#ffffff" stroke="#111111" stroke-width="1.5"/>
  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="140" y="330" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">TRAIN</text>
    <text x="330" y="330" text-anchor="middle" font-size="13" font-weight="bold">VALIDATE</text>
    <text x="520" y="330" text-anchor="middle" font-size="13" font-weight="bold">TEST</text>
  </g>

  <g stroke="#111111" fill="none">
    <path d="M 220 300 q 30 20 20 70 q -6 34 20 50" stroke-width="2" stroke-dasharray="4,3"/>
  </g>
  <polygon points="262,424 244,420 250,436" fill="#111111"/>
  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="240" y="452" font-size="11" font-weight="bold">session-id leak</text>
    <text x="240" y="468" font-size="11" fill="#555555">same recording in train &amp; test ⇒</text>
    <text x="240" y="482" font-size="11" fill="#555555">inflated accuracy, no real skill</text>
  </g>

  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="60" y="516" font-size="13" font-weight="bold">THE FIX — GROUP BY SESSION</text>
    <text x="60" y="536" font-size="12" fill="#555555">hold out whole sessions · never individual rows</text>
    <text x="60" y="552" font-size="12" fill="#555555">held-out substances ≥ held-out sessions ≥ leak</text>
  </g>

  <line x1="640" y1="240" x2="640" y2="560" stroke="#111111" stroke-width="1" stroke-dasharray="6,4"/>

  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="680" y="258" font-size="13" font-weight="bold">THE TWO QUESTIONS</text>
  </g>

  <g stroke="#111111" fill="none">
    <rect x="680" y="276" width="200" height="60" stroke-width="1.5"/>
    <rect x="900" y="276" width="200" height="60" stroke-width="1.5"/>
  </g>
  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="780" y="302" text-anchor="middle" font-size="12" font-weight="bold">SEEN SUBSTANCE?</text>
    <text x="780" y="320" text-anchor="middle" font-size="11" fill="#555555">81.78% session</text>
    <text x="780" y="336" text-anchor="middle" font-size="11" fill="#555555">invariance</text>
    <text x="1000" y="302" text-anchor="middle" font-size="12" font-weight="bold">NEW SUBSTANCE?</text>
    <text x="1000" y="320" text-anchor="middle" font-size="11" fill="#555555">R² = −14.62</text>
    <text x="1000" y="336" text-anchor="middle" font-size="11" fill="#555555">(worse than mean)</text>
  </g>
  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="680" y="372" font-size="11" fill="#555555">session invariance ≠ substance generalization</text>
    <text x="680" y="388" font-size="11" fill="#555555">never report one as the other</text>
  </g>

  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="680" y="420" font-size="13" font-weight="bold">PRE-REGISTERED GATES</text>
  </g>
  <g stroke="#111111" fill="none">
    <rect x="680" y="434" width="420" height="40" stroke-width="1.5"/>
  </g>
  <text x="698" y="460" font-family="ui-monospace, monospace" font-size="12" fill="#111111">threshold declared BEFORE fitting: e.g. &gt;70%</text>
  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="680" y="496" font-size="11" fill="#555555">fixed seeds (42) · consistent CV structure ·</text>
    <text x="680" y="512" font-size="11" fill="#555555">report balanced accuracy, not just accuracy</text>
  </g>

  <g stroke="#111111" fill="none">
    <line x1="680" y1="532" x2="1100" y2="532" stroke-width="1"/>
  </g>
  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="680" y="556" font-size="12" font-weight="bold">ADAPTERS (MIXED EVIDENCE):</text>
    <text x="680" y="572" font-size="11" fill="#555555">MSE 0.95 (sim) · cosine-loss 0.81 FAIL · conv1 fine-tune 0.409</text>
  </g>

  <rect x="840" y="522" width="328" height="76" fill="none" stroke="#111111" stroke-width="1.5"/>
  <line x1="840" y1="560" x2="1168" y2="560" stroke="#111111" stroke-width="1"/>
  <line x1="1020" y1="522" x2="1020" y2="598" stroke="#111111" stroke-width="1"/>
  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="852" y="546" font-size="12" font-weight="bold">OPEN SMELL ACADEMY</text>
    <text x="852" y="584" font-size="12">REV A · 2026</text>
    <text x="1032" y="546" font-size="12">FIG. 019</text>
    <text x="1032" y="584" font-size="12">SCALE NTS</text>
  </g>
</svg>
