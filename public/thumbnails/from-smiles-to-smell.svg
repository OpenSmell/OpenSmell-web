  <text x="78" y="288" font-family="ui-monospace, monospace" font-size="20" fill="#ffffff" font-weight="bold">CC(=O)OCC(C)C</text>
  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="78" y="252" font-size="11" fill="#555555">isoamyl acetate — "banana oil"</text>
  </g>

