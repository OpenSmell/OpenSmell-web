    <text x="78" y="486" font-size="20">P_vap → C_hs</text>
    <text x="78" y="506" font-size="11" fill="#555555">isoamyl acetate: 700 Pa ≈ 6,900 ppm</text>
    <text x="78" y="522" font-size="11" fill="#555555">cinnamaldehyde: 1.3 Pa ≈ 13 ppm</text>
    <text x="78" y="538" font-size="11" fill="#555555">(Joback groups → T_b, P_vap)</text>
  </g>

