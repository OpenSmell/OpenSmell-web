<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#ffffff"/>
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#111111" stroke-width="2.5"/>
  <rect x="32" y="32" width="1136" height="566" fill="none" stroke="#111111" stroke-width="1"/>

  <g stroke="#111111" stroke-width="1" fill="none">
    <line x1="32" y1="66" x2="80" y2="66"/><line x1="32" y1="564" x2="80" y2="564"/>
    <line x1="1120" y1="66" x2="1168" y2="66"/><line x1="1120" y1="564" x2="1168" y2="564"/>
    <line x1="40" y1="40" x2="40" y2="88"/><line x1="1160" y1="40" x2="1160" y2="88"/>
    <line x1="40" y1="542" x2="40" y2="590"/><line x1="1160" y1="542" x2="1160" y2="590"/>
  </g>

  <g fill="#e5e5e5" stroke="#111111" stroke-width="1">
    <polygon points="60,70 77,61 94,70 94,88 77,97 60,88"/>
    <polygon points="1140,70 1157,61 1174,70 1174,88 1157,97 1140,88"/>
  </g>

  <text x="48" y="56" font-family="ui-monospace, monospace" font-size="14" fill="#111111" letter-spacing="1">OPEN SMELL · ACADEMY</text>
  <text x="852" y="56" font-family="ui-monospace, monospace" font-size="14" fill="#555555" letter-spacing="1">FEASIBILITY CHAIN</text>
  <text x="600" y="128" text-anchor="middle" font-family="ui-monospace, monospace" font-size="38" font-weight="bold" fill="#111111" letter-spacing="1">MOX SMELLABILITY</text>
  <text x="600" y="156" text-anchor="middle" font-family="ui-monospace, monospace" font-size="15" fill="#555555" letter-spacing="1">4-STEP PHYSICS CHAIN · SnO₂ @ 350–450 °C</text>

  <line x1="120" y1="200" x2="1040" y2="200" stroke="#111111" stroke-width="1"/>

  <g stroke="#111111">
    <rect x="36" y="240" width="250" height="200" fill="#ffffff" stroke-width="2"/>
    <rect x="323" y="240" width="250" height="200" fill="#ffffff" stroke-width="2"/>
    <rect x="610" y="240" width="250" height="200" fill="#ffffff" stroke-width="2"/>
    <rect x="897" y="240" width="250" height="200" fill="#ffffff" stroke-width="2"/>
  </g>

  <g stroke="#111111" fill="#111111">
    <polygon points="292,332 312,332 312,340 326,326 312,312 312,320 292,320"/>
    <polygon points="579,332 599,332 599,340 613,326 599,312 599,320 579,320"/>
    <polygon points="866,332 886,332 886,340 900,326 886,312 886,320 866,320"/>
  </g>

  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="161" y="274" text-anchor="middle" font-size="14" font-weight="bold">1 · IDENTITY</text>
    <text x="161" y="294" text-anchor="middle" font-size="11" fill="#555555">curated / class / Joback</text>
    <text x="161" y="334" text-anchor="middle" font-size="11">what is the substance?</text>
    <text x="161" y="352" text-anchor="middle" font-size="11" fill="#555555">SMILES → functional groups</text>
    <text x="161" y="392" text-anchor="middle" font-size="12" fill="#555555">provenance: measured /</text>
    <text x="161" y="407" text-anchor="middle" font-size="12" fill="#555555">estimated / unknown</text>

    <text x="448" y="274" text-anchor="middle" font-size="14" font-weight="bold">2 · VOLATILITY</text>
    <text x="448" y="294" text-anchor="middle" font-size="11" fill="#555555">P_vap @ 25 °C</text>
    <text x="448" y="334" text-anchor="middle" font-size="11">Antoine or Clausius–Clapeyron</text>
    <text x="448" y="352" text-anchor="middle" font-size="11" fill="#555555">ΔH_vap ≈ 88 × T_boil</text>
    <text x="448" y="392" text-anchor="middle" font-size="12" fill="#555555">very high ≥ 10⁴ Pa</text>
    <text x="448" y="407" text-anchor="middle" font-size="12" fill="#555555">negligible &lt; 1 Pa</text>

    <text x="735" y="274" text-anchor="middle" font-size="14" font-weight="bold">3 · SIGNAL</text>
    <text x="735" y="294" text-anchor="middle" font-size="11" fill="#555555">headspace = P_vap/P_atm·10⁶</text>
    <text x="735" y="334" text-anchor="middle" font-size="11">ppm vs MOX floor = 1 ppm</text>
    <text x="735" y="352" text-anchor="middle" font-size="11" fill="#555555">flux ratio vs ethanol</text>
    <text x="735" y="392" text-anchor="middle" font-size="12" fill="#555555">strong ≥ 10³ ppm</text>
    <text x="735" y="407" text-anchor="middle" font-size="12" fill="#555555">none &lt; 1 ppm</text>

    <text x="1022" y="274" text-anchor="middle" font-size="14" font-weight="bold">4 · REACTIVITY</text>
    <text x="1022" y="294" text-anchor="middle" font-size="11" fill="#555555">redox at ~350 °C surface</text>
    <text x="1022" y="334" text-anchor="middle" font-size="11">reducing groups → GREEN</text>
    <text x="1022" y="352" text-anchor="middle" font-size="11" fill="#555555">inerts (N₂, CO₂, H₂O) → RED</text>
    <text x="1022" y="392" text-anchor="middle" font-size="12" fill="#555555">unclassified → YELLOW</text>
    <text x="1022" y="407" text-anchor="middle" font-size="12" fill="#555555">indirect effects only</text>
  </g>

  <g font-family="ui-monospace, monospace" text-anchor="middle" fill="#111111">
    <rect x="36" y="440" width="250" height="30" fill="#111111"/>
    <text x="161" y="460" font-size="12" font-weight="bold" fill="#ffffff">GREEN</text>
    <rect x="323" y="440" width="250" height="30" fill="#111111"/>
    <text x="448" y="460" font-size="12" font-weight="bold" fill="#ffffff">GREEN</text>
    <rect x="610" y="440" width="250" height="30" fill="#111111"/>
    <text x="735" y="460" font-size="12" font-weight="bold" fill="#ffffff">GREEN</text>
    <rect x="897" y="440" width="250" height="30" fill="#111111"/>
    <text x="1022" y="460" font-size="12" font-weight="bold" fill="#ffffff">GREEN</text>
  </g>

  <text x="600" y="500" text-anchor="middle" font-family="ui-monospace, monospace" font-size="13" font-weight="bold" fill="#111111">VERDICT = WORST OF THE FOUR STEPS</text>
  <text x="600" y="516" text-anchor="middle" font-family="ui-monospace, monospace" font-size="11" fill="#555555">a red anywhere is a red everywhere</text>

  <text x="40" y="542" font-family="ui-monospace, monospace" font-size="13" font-weight="bold" fill="#111111">HEADSPACE PPM BANDS @ 25 °C</text>
  <g stroke="#111111" stroke-width="1.5">
    <rect x="40" y="550" width="130" height="34" fill="#eeeeee"/>
    <rect x="170" y="550" width="130" height="34" fill="#999999"/>
    <rect x="300" y="550" width="130" height="34" fill="#666666"/>
    <rect x="430" y="550" width="130" height="34" fill="#333333"/>
    <rect x="560" y="550" width="260" height="34" fill="#111111"/>
  </g>
  <g font-family="ui-monospace, monospace" text-anchor="middle" fill="#111111">
    <text x="105" y="571" font-size="11" fill="#555555">none</text>
    <text x="235" y="571" font-size="11" fill="#ffffff">marginal</text>
    <text x="365" y="571" font-size="11" fill="#ffffff">weak</text>
    <text x="495" y="571" font-size="11" fill="#ffffff">moderate</text>
    <text x="690" y="571" font-size="11" fill="#ffffff">strong</text>
    <text x="105" y="599" font-size="10" fill="#555555">&lt;1</text>
    <text x="235" y="599" font-size="10" fill="#555555">10</text>
    <text x="365" y="599" font-size="10" fill="#555555">10²</text>
    <text x="495" y="599" font-size="10" fill="#555555">10³</text>
    <text x="690" y="599" font-size="10" fill="#555555">10⁴–10⁵ ppm</text>
  </g>

  <rect x="840" y="522" width="328" height="76" fill="none" stroke="#111111" stroke-width="1.5"/>
  <line x1="840" y1="560" x2="1168" y2="560" stroke="#111111" stroke-width="1"/>
  <line x1="1020" y1="522" x2="1020" y2="598" stroke="#111111" stroke-width="1"/>
  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="852" y="546" font-size="12" font-weight="bold">OPEN SMELL ACADEMY</text>
    <text x="852" y="584" font-size="12">REV A · 2026</text>
    <text x="1032" y="546" font-size="12">FIG. 013</text>
    <text x="1032" y="584" font-size="12">SCALE NTS</text>
  </g>
</svg>
