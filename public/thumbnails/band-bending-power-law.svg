<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#ffffff"/>
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#111111" stroke-width="2.5"/>
  <rect x="32" y="32" width="1136" height="566" fill="none" stroke="#111111" stroke-width="1"/>

  <g stroke="#111111" stroke-width="1" fill="none">
    <line x1="32" y1="66" x2="80" y2="66"/><line x1="32" y1="564" x2="80" y2="564"/>
    <line x1="1120" y1="66" x2="1168" y2="66"/><line x1="1120" y1="564" x2="1168" y2="564"/>
    <line x1="40" y1="40" x2="40" y2="88"/><line x1="1160" y1="40" x2="1160" y2="88"/>
    <line x1="40" y1="542" x2="40" y2="590"/><line x1="1160" y1="542" x2="1160" y2="590"/>
  </g>

  <g fill="#e5e5e5" stroke="#111111" stroke-width="1">
    <polygon points="60,70 77,61 94,70 94,88 77,97 60,88"/>
    <polygon points="1140,70 1157,61 1174,70 1174,88 1157,97 1140,88"/>
  </g>

  <text x="48" y="56" font-family="ui-monospace, monospace" font-size="14" fill="#111111" letter-spacing="1">OPEN SMELL · ACADEMY</text>
  <text x="852" y="56" font-family="ui-monospace, monospace" font-size="14" fill="#555555" letter-spacing="1">SURFACE CHEMISTRY</text>
  <text x="600" y="130" text-anchor="middle" font-family="ui-monospace, monospace" font-size="34" font-weight="bold" fill="#111111" letter-spacing="1">BAND BENDING &amp; THE POWER LAW</text>
  <text x="600" y="156" text-anchor="middle" font-family="ui-monospace, monospace" font-size="15" fill="#555555" letter-spacing="1">SnO₂ · Rs/R₀ = a·Cᵇ · REDUCING vs OXIDIZING GASES</text>

  <line x1="120" y1="200" x2="1040" y2="200" stroke="#111111" stroke-width="1"/>

  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="60" y="240" font-size="13" font-weight="bold">SURFACE — AIR INTERFACE</text>
  </g>

  <rect x="60" y="290" width="360" height="14" fill="#111111"/>
  <rect x="60" y="304" width="360" height="14" fill="#ffffff" stroke="#111111" stroke-width="1"/>
  <rect x="60" y="360" width="360" height="14" fill="#111111"/>
  <rect x="60" y="374" width="360" height="14" fill="#ffffff" stroke="#111111" stroke-width="1"/>
  <rect x="60" y="430" width="360" height="14" fill="#111111"/>
  <rect x="60" y="444" width="360" height="14" fill="#ffffff" stroke="#111111" stroke-width="1"/>

  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="60" y="276" font-size="11" fill="#555555">conduction band (CB)</text>
    <text x="60" y="348" font-size="11" fill="#555555">valence band (VB)</text>
    <text x="60" y="492" font-size="11" fill="#555555">SnO₂ grain — n-type, ~350–450 °C</text>
  </g>

  <g stroke="#111111" fill="none">
    <line x1="420" y1="262" x2="420" y2="472" stroke-width="1.5"/>
    <path d="M 60 262 q 120 14 240 10 q 60 -2 120 -16" stroke-width="1.5" stroke-dasharray="4,3"/>
    <path d="M 60 264 q 120 14 240 10 q 60 -2 120 -14" stroke-width="1" stroke-dasharray="2,3"/>
    <path d="M 60 468 q 120 -14 240 -10 q 60 2 120 16" stroke-width="1" stroke-dasharray="4,3"/>
  </g>

  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="430" y="266" font-size="11">qVs (barrier)</text>
    <text x="440" y="440" font-size="11" fill="#555555">depletion layer</text>
  </g>
  <line x1="446" y1="452" x2="446" y2="470" stroke="#111111" stroke-width="1"/>

  <g stroke="#111111" fill="none">
    <circle cx="150" cy="252" r="9" stroke-width="1.5"/>
    <circle cx="216" cy="248" r="8" stroke-width="1.5"/>
    <circle cx="292" cy="250" r="9" stroke-width="1.5"/>
  </g>
  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="138" y="238" font-size="11" font-weight="bold">O₂⁻</text>
    <text x="203" y="232" font-size="11" font-weight="bold">O⁻</text>
    <text x="280" y="234" font-size="11" font-weight="bold">O⁻</text>
  </g>

  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="60" y="516" font-size="12" font-weight="bold">REDUCING GAS (CO, C₂H₅OH):</text>
    <text x="60" y="534" font-size="11" fill="#555555">reacts with O⁻ → electrons released → barrier ↓ → Rs ↓</text>
    <text x="430" y="516" font-size="12" font-weight="bold">OXIDIZING GAS (NO₂, O₃):</text>
    <text x="430" y="534" font-size="11" fill="#555555">traps electrons → barrier ↑ → Rs ↑  (direction = ±1)</text>
  </g>

  <line x1="500" y1="240" x2="500" y2="500" stroke="#111111" stroke-width="1" stroke-dasharray="6,4"/>

  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="520" y="240" font-size="13" font-weight="bold">THE EMPIRICAL POWER LAW</text>
    <text x="520" y="276" font-size="13">Rs/R₀ = a · Cᵇ</text>
    <text x="520" y="294" font-size="11" fill="#555555">(log-log ⇒ straight line)</text>
  </g>

  <g stroke="#111111" fill="none">
    <line x1="520" y1="330" x2="520" y2="500" stroke-width="1.5"/>
    <line x1="520" y1="500" x2="780" y2="500" stroke-width="1.5"/>
    <polygon points="780,500 768,492 768,508"/>
    <polygon points="520,330 528,342 512,342"/>
  </g>
  <line x1="520" y1="420" x2="540" y2="420" stroke="#111111" stroke-width="1"/>
  <line x1="520" y1="360" x2="540" y2="360" stroke="#111111" stroke-width="1"/>
  <line x1="570" y1="500" x2="570" y2="486" stroke="#111111" stroke-width="1"/>
  <line x1="650" y1="500" x2="650" y2="486" stroke="#111111" stroke-width="1"/>
  <line x1="740" y1="500" x2="740" y2="486" stroke="#111111" stroke-width="1"/>
  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="560" y="518" font-size="11">1</text>
    <text x="640" y="518" font-size="11">10</text>
    <text x="730" y="518" font-size="11">100</text>
    <text x="648" y="322" font-size="11" fill="#555555">log C (ppm)</text>
  </g>

  <path d="M 545 455 q 40 -6 60 -12 q 40 -12 100 -30" stroke="#111111" stroke-width="2" fill="none"/>
  <path d="M 545 465 q 40 8 70 20 q 40 14 105 22" stroke="#111111" stroke-width="2" fill="none"/>
  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="740" y="400" font-size="11" font-weight="bold">b</text>
    <text x="756" y="400" font-size="11" fill="#555555">= slope</text>
    <text x="740" y="416" font-size="11" font-weight="bold">a</text>
    <text x="756" y="416" font-size="11" fill="#555555">= intercept</text>
    <text x="540" y="540" font-size="11" fill="#555555">a, b are model + unit specific · 20–30% batch tolerance</text>
  </g>

  <line x1="820" y1="240" x2="820" y2="540" stroke="#111111" stroke-width="1" stroke-dasharray="6,4"/>

  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="840" y="266" font-size="13" font-weight="bold">CROSS-SENSITIVITY</text>
    <text x="840" y="288" font-size="11" fill="#555555">no MQ sensor is selective —</text>
    <text x="840" y="304" font-size="11" fill="#555555">selectivity is RELATIVE</text>
    <text x="840" y="324" font-size="11" fill="#555555">(ratios across the array)</text>
  </g>
  <g stroke="#111111" fill="none">
    <line x1="840" y1="350" x2="1140" y2="350" stroke-width="1"/>
    <line x1="880" y1="362" x2="880" y2="490" stroke-width="2"/>
    <line x1="960" y1="362" x2="960" y2="410" stroke-width="2"/>
    <line x1="1040" y1="362" x2="1040" y2="470" stroke-width="2"/>
    <line x1="1120" y1="362" x2="1120" y2="440" stroke-width="2"/>
  </g>
  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="858" y="336" font-size="11" fill="#555555">4 channels, same gas</text>
    <text x="856" y="510" font-size="11">different ΔRs/R₀ per channel</text>
  </g>

  <rect x="840" y="528" width="328" height="62" fill="none" stroke="#111111" stroke-width="1"/>
  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="856" y="548" font-size="11" font-weight="bold">sel_ratio_chᵢ_chⱼ = (ΔRsᵢ/ΔRsⱼ)</text>
    <text x="856" y="566" font-size="11" fill="#555555">→ concentration-invariant only if bᵢ = bⱼ</text>
    <text x="856" y="582" font-size="11" fill="#555555">→ the feature behind the array's power</text>
  </g>

  <rect x="840" y="522" width="328" height="76" fill="none" stroke="#111111" stroke-width="1.5"/>
  <line x1="840" y1="560" x2="1168" y2="560" stroke="#111111" stroke-width="1"/>
  <line x1="1020" y1="522" x2="1020" y2="598" stroke="#111111" stroke-width="1"/>
  <g font-family="ui-monospace, monospace" fill="#111111">
    <text x="852" y="546" font-size="12" font-weight="bold">OPEN SMELL ACADEMY</text>
    <text x="852" y="584" font-size="12">REV A · 2026</text>
    <text x="1032" y="546" font-size="12">FIG. 011</text>
    <text x="1032" y="584" font-size="12">SCALE NTS</text>
  </g>
</svg>
